name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: canpilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release APK
        run: |
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/canpilot-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: canpilot-release
          path: app/build/outputs/apk/release/canpilot-release.apk
