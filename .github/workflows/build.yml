name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # a v* tag publishes a release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: canpilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "canpilot-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "canpilot-${GITHUB_REF_NAME}.apk" --generate-notes
