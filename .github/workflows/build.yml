name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds only read the repository; the publish job alone may write.
permissions:
  contents: read

jobs:
  build:
    # a pull request from a branch of this repository is already built by its push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # a newer push to the same branch replaces a build still running
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug -PversionCode=${{ github.run_number }}
      - name: Lint
        # reports only, until the existing warnings are cleared
        continue-on-error: true
        run: ./gradlew :app:lintDebug -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: canlens-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release APK
        # Signed with the release key when the repository has one in its secrets, else with the debug key.
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }}
          rm -f "$RUNNER_TEMP/release.jks"
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/canlens-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: canlens-release
          path: app/build/outputs/apk/release/canlens-release.apk

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # main's APK goes to the "latest" release
    # one publish at a time, never cut off halfway: "latest" ends on the newest build
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: canlens-release
          path: ${{ runner.temp }}/apk
      - name: Publish main's APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/apk/canlens-release.apk" "$RUNNER_TEMP/canlens.apk"
          git push -f origin HEAD:refs/tags/latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "The newest build of main, replaced on every push."
          gh release edit latest --notes "The newest build of main (${GITHUB_SHA::7}, build ${{ github.run_number }}), replaced on every push."
          gh release upload latest "$RUNNER_TEMP/canlens.apk" --clobber
